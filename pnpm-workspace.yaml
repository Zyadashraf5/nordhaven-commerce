packages:
  - apps/*
  - front

overrides:
  # Security patches for development tooling; keep other major versions untouched.
  'webpack@>=5.49.0 <5.104.1': 5.104.1
  'ajv@>=8.0.0 <8.18.0': 8.20.0
  'picomatch@>=4.0.0 <4.0.4': 4.0.7
  'deepmerge-ts@7.1.5': 8.0.0
  'mysql2@>=3.0.0 <3.23.1': 3.23.1
  js-yaml: 4.3.2
  lodash: 4.18.1
  multer: 2.5.0
  body-parser: 2.4.0
  path-to-regexp: 8.4.0
  # Frontend build tooling (front/): Next.js pulls postcss transitively; the
  # patched release keeps `pnpm audit --audit-level high` clean.
  postcss: 8.5.31

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  prisma: true
  # Frontend build tooling (front/): esbuild ships the binary Vitest needs,
  # unrs-resolver ships the native resolver ESLint uses.
  esbuild: true
  unrs-resolver: true

patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
