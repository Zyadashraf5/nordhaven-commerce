name: nordhaven-commerce
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nordhaven}
      POSTGRES_USER: ${POSTGRES_USER:-nordhaven}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - nordhaven-postgres:/var/lib/postgresql
    restart: unless-stopped

volumes:
  nordhaven-postgres:
